[project]
name = "gdeltx"
version = "0.1.0"
description = "A CLI for OSINT investigation using the GDELT APIs."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.14"
authors = [{ name = "Peace" }]
keywords = ["gdelt", "osint", "cli", "news", "investigation"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]

dependencies = [
    "httpx>=0.28",
    "typer>=0.15",
    "pydantic>=2.10",
    "rich>=13.9",
]

[project.urls]
Homepage = "https://github.com/PeacexF/gdeltx"
Repository = "https://github.com/PeacexF/gdeltx"

[project.scripts]
gdeltx = "gdeltx.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "respx>=0.22",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gdeltx"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "PTH", "RUF"]
# typer's Option/Argument idiom requires calls in argument defaults
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["gdeltx"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
xfail_strict = true
filterwarnings = ["error"]
